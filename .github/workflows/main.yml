name: Build Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install

      - name: Build
        run: |
          mkdir -p data/dictionaries
          git clone --depth 1 https://github.com/tryubma/xianbao-directory.git /tmp/upstream
          cp -r /tmp/upstream/data/dictionaries/* data/dictionaries/ 2>/dev/null || true
          node build-all.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
